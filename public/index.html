<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worknote · 업무의 흐름을 한곳에</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar"><a class="brand" href="/">w<span>worknote</span></a><div class="workspace"><span class="avatar">W</span><div>나의 워크스페이스<small>Personal workspace</small></div></div><p class="nav-label">WORKSPACE</p><nav aria-label="주 메뉴"><button data-view="wizard">✧ <span>GPT 정리 마법사</span></button><button data-view="board">▦ <span>업무 노드 보드</span></button><button data-view="dashboard" class="active">◫ <span>대시보드</span></button><button data-view="tasks">☑ <span>업무 목록</span></button><button data-view="history">◷ <span>업무 히스토리</span></button><button data-view="repeat">↻ <span>반복 업무</span></button><button data-view="wiki">▤ <span>지식 위키</span></button><button data-view="alerts">♧ <span>알림함</span><b id="alert-count">2</b></button></nav><div class="side-bottom"><div class="demo-dot"></div> UI 프로토타입<small>샘플 데이터 · 이 브라우저에 저장</small><div class="profile"><span class="avatar">나</span><div>개인 워크스페이스<small>나의 업무와 지식</small></div></div></div></aside>
<div class="shell"><header><div>워크스페이스 <span>/</span> <strong id="breadcrumb">대시보드</strong></div><span class="header-note">작은 기록이, 큰 지식으로.</span></header><main><div class="heading"><div><p class="eyebrow">YOUR WORK, CONNECTED</p><h1 id="page-title">업무의 흐름을 한눈에</h1><p id="page-description">오늘의 업무부터 쌓여가는 지식까지, 차근차근 정리하세요.</p></div><button class="primary" id="new-task">＋ 새 업무</button></div><div id="content"></div></main><footer>WORKNOTE <span>업무를 기록하고, 지식으로 연결하세요.</span></footer></div>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-heading"><h2>새 업무 만들기</h2><button type="button" id="close-dialog" aria-label="닫기">×</button></div><label>업무 제목<input name="title" required maxlength="120" placeholder="어떤 업무를 진행할까요?"></label><label>기한<input type="date" name="due" required></label><label>분류<select name="category"><option>기획</option><option>개발</option><option>운영</option></select></label><button class="primary" type="submit">업무 등록</button></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
